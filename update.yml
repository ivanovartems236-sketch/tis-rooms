name: Обновление расписания

on:
  schedule:
    - cron: "5 3-17 * * 1-6"   # каждый час 06:05–20:05 МСК, пн–сб
  workflow_dispatch:            # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python build.py
      - name: Сохранить data.json
        run: |
          git config user.name "rasp-bot"
          git config user.email "rasp-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Расписание обновлено" && git push)
